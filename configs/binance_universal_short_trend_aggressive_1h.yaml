  htf_fast_ema: 24
  htf_slow_ema: 96
  htf_adx_period: 14
  htf_adx_threshold: 16
  ltf_ema: 20
  rsi_period: 14
  rsi_short_min: 30
  rsi_short_max: 54
  atr_period: 14
  atr_stop_mult: 1.0
  trail_atr_mult: 1.4
  partial_rr: 1.0
  partial_close_ratio: 0.5
  pullback_atr_tolerance: 0.4
  swing_lookback: 6
  volume_sma: 20
  min_volume_ratio: 0.8
  min_atr_pct: 0.001
  max_atr_pct: 0.03
  max_bars_in_trade: 48
  flat_on_new_day: false
  allow_long: false
  allow_short: true

